services:
  postgres:
    image: postgres:16-alpine
    container_name: amal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amal_dev_password
      POSTGRES_DB: amal_db
    ports:
      - "5432:5432"
    volumes:
      - amal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: amal_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:amal_dev_password@postgres:5432/amal_db
      DATABASE_SSL: disable
      WEB_ORIGIN: http://localhost:5173
      # Replace with your Supabase project keys
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  amal_pgdata:
